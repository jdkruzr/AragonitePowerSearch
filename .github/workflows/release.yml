name: Build Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PowerSearch
        uses: actions/checkout@v4
        with:
          path: AragonitePowerSearch

      - name: Checkout AragoniteHWR
        uses: actions/checkout@v4
        with:
          repository: jdkruzr/AragoniteHWR
          path: AragoniteHWR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: AragonitePowerSearch
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        working-directory: AragonitePowerSearch
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PowerSearch-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AragonitePowerSearch/app/build/outputs/apk/debug/PowerSearch-*.apk
          generate_release_notes: true
